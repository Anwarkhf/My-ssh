app = "my-ssh"
primary_region = "ams"

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = []

  [[services.ports]]
    port = 443
    handlers = []

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500
